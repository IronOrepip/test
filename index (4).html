<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1f1f; }
    .wall { height: 100vh; display: flex; flex-direction: column; }
    .row { flex: 1; display: flex; align-items: center; overflow: hidden; background: #1f1f1f; }
    .row:nth-child(even) { background: #fff; }
    .track { display: flex; width: max-content; filter: blur(3.6px); animation: scroll 60s linear infinite; }
    .row:nth-child(even) .track { animation-direction: reverse; }
    .track img { height: 56px; width: auto; margin-right: 64px; flex-shrink: 0; }
    @keyframes scroll { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @media (max-width: 600px) { .track img { height: 34px; margin-right: 36px; } }
    @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
    .mark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); height: 34vh; width: auto; z-index: 1; }

    .cc { position: fixed; z-index: 10; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: #f4f0eb; color: #1f1f1f; border-radius: 16px; padding: 20px 22px; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cc[hidden], .cc-panel[hidden], .cc-reopen[hidden] { display: none; }
    .cc h2 { margin: 0 0 6px; font-size: 17px; }
    .cc p { margin: 0 0 14px; color: #4a4744; }
    .cc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .cc button { flex: 1 1 auto; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1.5px solid #1f1f1f; background: transparent; color: #1f1f1f; font: inherit; font-weight: 600; cursor: pointer; }
    .cc button.primary { background: #1f1f1f; color: #f4f0eb; }
    .cc button:focus-visible, .cc input:focus-visible, .cc-reopen:focus-visible { outline: 2px solid #e8552d; outline-offset: 2px; }
    .cc-panel { margin: 0 0 14px; border-top: 1px solid #d9d4cd; }
    .cc-opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid #d9d4cd; }
    .cc-opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: #1f1f1f; flex-shrink: 0; }
    .cc-opt strong { display: block; }
    .cc-opt span { color: #6e6a65; font-size: 14px; }
    .cc-reopen { position: fixed; z-index: 9; right: 16px; bottom: 16px; padding: 8px 14px; border: 0; border-radius: 999px; background: #f4f0eb; color: #1f1f1f; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  </style>

      <label class="cc-opt"><input type="checkbox" checked disabled><div><strong>Necessary</strong><span>Required for the site to work, for example remembering this choice. Always on.</span></div></label>
      <label class="cc-opt"><input type="checkbox" id="cc-analytics"><div><strong>Analytics</strong><span>Helps us understand how visitors use the site.</span></div></label>
      <label class="cc-opt"><input type="checkbox" id="cc-marketing"><div><strong>Marketing</strong><span>Used to show relevant content and measure campaigns.</span></div></label>
    </div>
    <div class="cc-actions">
      <button type="button" id="cc-reject">Reject all</button>
      <button type="button" id="cc-custom">Customise</button>
      <button type="button" id="cc-save" hidden>Save choices</button>
      <button type="button" class="primary" id="cc-accept">Accept all</button>
    </div>
  </div>
  <button type="button" class="cc-reopen" id="cc-reopen" hidden>Cookie settings</button>
  <script>
    (function () {
      var KEY = 'nova-consent-v1';
      var $ = function (id) { return document.getElementById(id); };
      var box = $('cc'), panel = $('cc-panel'), reopen = $('cc-reopen');
      var read = function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
      function apply(c) {
        window.novaConsent = c;
        document.dispatchEvent(new CustomEvent('nova-consent', { detail: c }));
      }
      function save(analytics, marketing) {
        var c = { necessary: true, analytics: analytics, marketing: marketing, date: new Date().toISOString() };
        try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
        box.hidden = true; reopen.hidden = false;
        apply(c);
      }
      function open() {
        var c = read() || {};
        $('cc-analytics').checked = !!c.analytics;
        $('cc-marketing').checked = !!c.marketing;
        box.hidden = false; reopen.hidden = true;
      }
      $('cc-accept').onclick = function () { save(true, true); };
      $('cc-reject').onclick = function () { save(false, false); };
      $('cc-custom').onclick = function () { panel.hidden = false; this.hidden = true; $('cc-save').hidden = false; };
      $('cc-save').onclick = function () { save($('cc-analytics').checked, $('cc-marketing').checked); };
      reopen.onclick = open;
      var c = read();
      if (c) { reopen.hidden = false; apply(c); } else { open(); }
    })();
  </script>
</body>
</html>
