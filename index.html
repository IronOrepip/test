  <script>
    // Slowly flowing "oil slick" gradient, drawn with a WebGL shader.
    var canvas = document.getElementById('bg');
    var gl = canvas.getContext('webgl');
    if (gl) {
      var vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
      var fs = [
        'precision mediump float;',
        'uniform vec2 res; uniform float t;',
        'vec2 h(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return -1.0 + 2.0 * fract(sin(p) * 43758.5453); }',
        'float n(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(dot(h(i), f), dot(h(i + vec2(1, 0)), f - vec2(1, 0)), u.x), mix(dot(h(i + vec2(0, 1)), f - vec2(0, 1)), dot(h(i + vec2(1, 1)), f - vec2(1, 1)), u.x), u.y); }',
        'float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * n(p); p *= 2.0; a *= 0.5; } return v; }',
        'void main() {',
        '  vec2 uv = gl_FragCoord.xy / res.y * 0.9; float s = t * 0.05;',
        '  vec2 q = vec2(fbm(uv + s), fbm(uv + vec2(5.2, 1.3) - s));',
        '  vec2 r = vec2(fbm(uv + 3.0 * q + vec2(1.7, 9.2) + s * 1.5), fbm(uv + 3.0 * q + vec2(8.3, 2.8) - s));',
        '  float f = fbm(uv + 3.0 * r);',
        '  vec3 base = vec3(0.122);',
        '  float x = f * 2.2 + q.x * 1.3 + r.y * 0.8;',
        '  vec3 iri = 0.5 + 0.5 * cos(6.2832 * (x + vec3(0.0, 0.18, 0.42)));',
        '  iri = mix(iri, vec3(0.91, 0.333, 0.176), smoothstep(0.55, 0.95, iri.r) * 0.6);',
        '  float glow = smoothstep(-0.25, 0.45, f + 0.6 * q.y);',
        '  vec3 c = mix(base, iri * 0.85, glow * 0.8);',
        '  gl_FragColor = vec4(c, 1.0);',
        '}'
      ].join('\n');
      function sh(type, s) { var o = gl.createShader(type); gl.shaderSource(o, s); gl.compileShader(o); return o; }
      var pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(pr); gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(pr, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var uRes = gl.getUniformLocation(pr, 'res'), uT = gl.getUniformLocation(pr, 't');
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function size() {
        var d = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = innerWidth * d; canvas.height = innerHeight * d;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      function frame(ms) {
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uT, still ? 20.0 : 20.0 + ms / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (!still) requestAnimationFrame(frame);
      }
      size(); addEventListener('resize', size);
      requestAnimationFrame(frame);
    }
  </script>
  <div class="cc" id="cc" role="dialog" aria-modal="false" aria-labelledby="cc-title" hidden>
    <h2 id="cc-title">Cookie settings</h2>
    <p>We use essential storage to make this site work. With your consent, we may also use analytics and marketing cookies. You can change your choice at any time.</p>
    <div class="cc-panel" id="cc-panel" hidden>
      <label class="cc-opt"><input type="checkbox" checked disabled><div><strong>Necessary</strong><span>Required for the site to work, for example remembering this choice. Always on.</span></div></label>
      <label class="cc-opt"><input type="checkbox" id="cc-analytics"><div><strong>Analytics</strong><span>Helps us understand how visitors use the site.</span></div></label>
      <label class="cc-opt"><input type="checkbox" id="cc-marketing"><div><strong>Marketing</strong><span>Used to show relevant content and measure campaigns.</span></div></label>
    </div>
    <div class="cc-actions">
      <button type="button" id="cc-reject">Reject all</button>
      <button type="button" id="cc-custom">Customise</button>
      <button type="button" id="cc-save" hidden>Save choices</button>
      <button type="button" class="primary" id="cc-accept">Accept all</button>
    </div>
  </div>
  <button type="button" class="cc-reopen" id="cc-reopen" hidden>Cookie settings</button>
  <script>
    (function () {
      var KEY = 'nova-consent-v1';
      var $ = function (id) { return document.getElementById(id); };
      var box = $('cc'), panel = $('cc-panel'), reopen = $('cc-reopen');
      var read = function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
      function apply(c) {
        window.novaConsent = c;
        document.dispatchEvent(new CustomEvent('nova-consent', { detail: c }));
      }
      function save(analytics, marketing) {
        var c = { necessary: true, analytics: analytics, marketing: marketing, date: new Date().toISOString() };
        try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
        box.hidden = true; reopen.hidden = false;
        apply(c);
      }
      function open() {
        var c = read() || {};
        $('cc-analytics').checked = !!c.analytics;
        $('cc-marketing').checked = !!c.marketing;
        box.hidden = false; reopen.hidden = true;
      }
      $('cc-accept').onclick = function () { save(true, true); };
      $('cc-reject').onclick = function () { save(false, false); };
      $('cc-custom').onclick = function () { panel.hidden = false; this.hidden = true; $('cc-save').hidden = false; };
      $('cc-save').onclick = function () { save($('cc-analytics').checked, $('cc-marketing').checked); };
      reopen.onclick = open;
      var c = read();
      if (c) { reopen.hidden = false; apply(c); } else { open(); }
    })();
  </script>
