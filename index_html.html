    .n { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(var(--s) * 0.339); height: calc(var(--s) * 0.375); z-index: 2;

      animation: glow 4.5s ease-in-out infinite; }
    /* Slow, soft "breathing" of the glow */

      0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 250, 242, 1)) drop-shadow(0 0 8px rgba(255, 246, 232, 1)) drop-shadow(0 0 20px rgba(255, 240, 220, 0.85)) drop-shadow(0 0 44px rgba(255, 236, 214, 0.6)); }
      50% { filter: drop-shadow(0 0 1px rgba(255, 250, 242, 0.6)) drop-shadow(0 0 4px rgba(255, 246, 232, 0.45)) drop-shadow(0 0 10px rgba(255, 240, 220, 0.3)) drop-shadow(0 0 22px rgba(255, 236, 214, 0.15)); }
    }
    @media (prefers-reduced-motion: reduce) { .n { animation: none; } }
    .cc { position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translateX(-50%); width: min(700px, 100%); box-sizing: border-box; isolation: isolate; overflow: hidden;
      background: rgba(31, 31, 31, 0.10); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
      color: #f4f0eb; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); border-radius: 56px; padding: 66px 68px;
      --f: 64px;

      -webkit-mask-composite: source-in; mask: linear-gradient(to right, transparent, rgba(0,0,0,.15) calc(var(--f) * .35), rgba(0,0,0,.55) calc(var(--f) * .7), #000 var(--f), #000 calc(100% - var(--f)), rgba(0,0,0,.55) calc(100% - var(--f) * .7), rgba(0,0,0,.15) calc(100% - var(--f) * .35), transparent), linear-gradient(to bottom, transparent, rgba(0,0,0,.15) calc(var(--f) * .35), rgba(0,0,0,.55) calc(var(--f) * .7), #000 var(--f), #000 calc(100% - var(--f)), rgba(0,0,0,.55) calc(100% - var(--f) * .7), rgba(0,0,0,.15) calc(100% - var(--f) * .35), transparent);
      mask-composite: intersect; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

    .cc[hidden], .cc-panel[hidden], .cc-reopen[hidden] { display: none; }
    .cc h2 { margin: 0 0 6px; font-size: 17px; }
    .cc p { margin: 0 0 14px; color: #f4f0eb; }
    .cc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .cc button { flex: 1 1 auto; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1.5px solid rgba(244, 240, 235, 0.7); background: transparent; color: #f4f0eb; font: inherit; font-weight: 600; cursor: pointer; }
    .cc button.primary { background: #f4f0eb; border-color: #f4f0eb; color: #1f1f1f; text-shadow: none; }
    .cc button:focus-visible, .cc input:focus-visible, .cc-reopen:focus-visible { outline: 2px solid #e8552d; outline-offset: 2px; }
    .cc-panel { margin: 0 0 14px; border-top: 1px solid rgba(244, 240, 235, 0.2); }
    .cc-opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(244, 240, 235, 0.2); }
    .cc-opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: #f4f0eb; flex-shrink: 0; }
    .cc-opt strong { display: block; }
    .cc-opt span { color: #ece7e0; font-size: 14px; }
    .cc-reopen { position: fixed; z-index: 9; right: 16px; bottom: 16px; padding: 8px 14px; border: 0; border-radius: 999px; background: rgba(31, 31, 31, 0.10); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: #f4f0eb; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }


    /* Opening animation: white screen, big charcoal N that shrinks into the glowing logo */
    #intro { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
    #intro .white { position: absolute; inset: 0; background: #fff; animation: introBg 1.1s ease-in-out .5s forwards; }
    #intro img { position: fixed; left: 50%; top: 50%; width: calc(var(--s) * 0.339); height: calc(var(--s) * 0.375);
      transform: translate(-50%, -50%) scale(3.2);
      filter: drop-shadow(0 0 6px rgba(255, 246, 232, .9)) drop-shadow(0 0 26px rgba(255, 240, 220, .6));
      animation: introN 2.5s cubic-bezier(.7, 0, .25, 1) .1s forwards; }
    @keyframes introN {
      0%, 40% { opacity: 1; transform: translate(-50%, -50%) scale(3.2); }
      88% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes introBg { to { opacity: 0; } }
    body.intro .n { opacity: 0; }
    body.intro-out .n { animation: nIn .5s ease-out forwards, glow 4.5s ease-in-out .5s infinite; }
    @keyframes nIn { from { opacity: 0; filter: none; } to { opacity: 1; } }
    body.intro .cc, body.intro .cc-reopen { visibility: hidden; }

<body>
  <h1 style="position:absolute;left:-9999px">NOVA</h1>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="stars" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
  <script>
    (function () { var c = document.getElementById('stars'), x = c.getContext('2d'), st = [], W, H;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function size() { var D = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * D; c.height = H * D; x.setTransform(D, 0, 0, D, 0, 0);
        st = []; for (var i = 0, n = Math.round(W * H / 2400); i < n; i++) st.push({ x: Math.random() * W, y: Math.random() * H, r: .3 + Math.pow(Math.random(), 3) * 1.5, p: Math.random() * 6.283, s: .5 + Math.random() * 1.5 }); }
      function draw(ms) { var t = ms / 1000; x.clearRect(0, 0, W, H);
        var P = window.novaPointer, R = Math.min(W, H) * .35;
        for (var i = 0; i < st.length; i++) { var s = st[i], sx = s.x, sy = s.y;
          if (P && P.k > .01) { var dx = sx - P.x, dy = sy - P.y, dd = Math.sqrt(dx * dx + dy * dy) || 1, f = P.k * 38 * Math.exp(-dd * dd / (R * R)); sx += dx / dd * f; sy += dy / dd * f; }
          x.fillStyle = 'rgba(244, 240, 235,' + (.35 + .65 * (.5 + .5 * Math.sin(t * s.s + s.p))) + ')'; x.beginPath(); x.arc(sx, sy, s.r, 0, 6.283); x.fill(); }
        if (!still) requestAnimationFrame(draw); }
      size(); addEventListener('resize', size); requestAnimationFrame(draw); })();
  </script>

  <script>
    // Slowly flowing "oil slick" gradient, drawn with a WebGL shader.
    var canvas = document.getElementById('bg');
    var gl = canvas.getContext('webgl');
    if (gl) {
      var vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
      var fs = [
        'precision mediump float;',
        'uniform vec2 res; uniform float t; uniform vec3 m;',
        'vec2 h(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return -1.0 + 2.0 * fract(sin(p) * 43758.5453); }',
        'float n(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(dot(h(i), f), dot(h(i + vec2(1, 0)), f - vec2(1, 0)), u.x), mix(dot(h(i + vec2(0, 1)), f - vec2(0, 1)), dot(h(i + vec2(1, 1)), f - vec2(1, 1)), u.x), u.y); }',
        'float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * n(p); p *= 2.0; a *= 0.5; } return v; }',
        'void main() {',
        '  vec2 uv = gl_FragCoord.xy / res.y * 0.9; float s = t * 0.05;',
        '  vec2 mp = m.xy / res.y * 0.9, dm = uv - mp;',
        '  float k = m.z * exp(-dot(dm, dm) * 6.0);',          // warp strength, strongest at the pointer
        '  float an = k * 2.2; dm = mat2(cos(an), -sin(an), sin(an), cos(an)) * dm;',
        '  uv = mp + dm * (1.0 - 0.25 * k);',
        '  vec2 q = vec2(fbm(uv + s), fbm(uv + vec2(5.2, 1.3) - s));',
        '  vec2 r = vec2(fbm(uv + 3.0 * q + vec2(1.7, 9.2) + s * 1.5), fbm(uv + 3.0 * q + vec2(8.3, 2.8) - s));',
        '  float f = fbm(uv + 3.0 * r);',
        '  vec3 base = vec3(0.06, 0.055, 0.07);',
        '  vec3 violet = vec3(0.45, 0.22, 0.65);',
        '  vec3 orange = vec3(0.91, 0.333, 0.176);',
        '  float cloud = smoothstep(-0.35, 0.45, f + 0.5 * q.y);',
        '  vec3 c = mix(base, violet * 0.9, cloud * 0.85);',
        '  c = mix(c, orange, smoothstep(0.05, 0.55, f + r.x * 0.5) * 0.75);',
        '  c = mix(c, vec3(1.0, 0.9, 0.8), smoothstep(0.45, 0.9, f + r.x * 0.6) * 0.35);',
        '  c *= 0.35 + 0.65 * smoothstep(-0.6, 0.3, f + q.x * 0.5);',
        '  gl_FragColor = vec4(c, 1.0);',
        '}'
      ].join('\n');
      function sh(type, s) { var o = gl.createShader(type); gl.shaderSource(o, s); gl.compileShader(o); return o; }
      var pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(pr); gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(pr, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var uRes = gl.getUniformLocation(pr, 'res'), uT = gl.getUniformLocation(pr, 't'), uM = gl.getUniformLocation(pr, 'm');
      // Pointer warp: the clouds swirl around the mouse (or finger) and settle back when it stops.
      var ptr = window.novaPointer = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, k: 0, tk: 0, last: 0 };
      function move(x, y) { ptr.tx = x; ptr.ty = y; ptr.tk = 1; ptr.last = performance.now(); }
      addEventListener('pointermove', function (e) { move(e.clientX, e.clientY); }, { passive: true });
      addEventListener('touchmove', function (e) { var t = e.touches[0]; if (t) move(t.clientX, t.clientY); }, { passive: true });
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function size() {
        var d = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = innerWidth * d; canvas.height = innerHeight * d;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      function frame(ms) {
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uT, still ? 20.0 : 20.0 + ms / 1000);
        if (performance.now() - ptr.last > 600) ptr.tk = 0;
        ptr.x += (ptr.tx - ptr.x) * 0.06; ptr.y += (ptr.ty - ptr.y) * 0.06; ptr.k += (ptr.tk - ptr.k) * (ptr.tk ? 0.05 : 0.015);
        var d = canvas.width / innerWidth;
        gl.uniform3f(uM, ptr.x * d, (innerHeight - ptr.y) * d, still ? 0 : ptr.k);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (!still) requestAnimationFrame(frame);
      }
      size(); addEventListener('resize', size);
      requestAnimationFrame(frame);
    }
  </script>

  <script>
    (function () {
      var KEY = 'nova-consent-v1';
      var $ = function (id) { return document.getElementById(id); };
      var box = $('cc'), panel = $('cc-panel'), reopen = $('cc-reopen');
      var read = function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
      function apply(c) {
        window.novaConsent = c;
        document.dispatchEvent(new CustomEvent('nova-consent', { detail: c }));
      }
      function save(analytics, marketing) {
        var c = { necessary: true, analytics: analytics, marketing: marketing, date: new Date().toISOString() };
        try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
        box.hidden = true; reopen.hidden = false;
        apply(c);
      }
      function open() {
        var c = read() || {};
        $('cc-analytics').checked = !!c.analytics;
        $('cc-marketing').checked = !!c.marketing;
        box.hidden = false; reopen.hidden = true;
      }
      $('cc-accept').onclick = function () { save(true, true); };
      $('cc-reject').onclick = function () { save(false, false); };
      $('cc-custom').onclick = function () { panel.hidden = false; this.hidden = true; $('cc-save').hidden = false; };
      $('cc-save').onclick = function () { save($('cc-analytics').checked, $('cc-marketing').checked); };
      reopen.onclick = open;
      var c = read();
      if (c) { reopen.hidden = false; apply(c); } else { open(); }
    })();
